<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A3161" />
    <link rel="icon" type="image/png" href="/crest.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Uncle Sam FC" />
    <title>Uncle Sam FC</title>
    <style>
      /* Splash screen: styled inline so it paints before any bundle loads.
         The React copy in App.jsx reuses these classes — keep them in sync. */
      .splash {
        position: fixed; inset: 0; z-index: 200;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        padding-bottom: max(7vh, env(safe-area-inset-bottom));
        background:
          linear-gradient(to bottom, rgba(10,49,97,0) 40%, rgba(10,49,97,0.55) 70%, rgba(10,49,97,0.92) 100%),
          #0A3161 url('/crest.png') center / cover no-repeat;
        transition: opacity 0.35s ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .splash.out { opacity: 0; pointer-events: none; }
      .splash-title, .splash-motto { text-shadow: 0 1px 8px rgba(10,49,97,0.9); }
      .splash-title {
        color: #fff; font-style: italic; font-size: 2rem;
        letter-spacing: 0.02em; margin: 10px 0 2px; font-weight: 700;
      }
      .splash-motto { display: flex; flex-direction: column; align-items: center; color: #E0455F; }
      .splash-motto .m-line { font-family: 'Pinyon Script', cursive; font-size: 1.5rem; line-height: 1.1; }
      .splash-motto .m-yanks {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.1rem; font-weight: 700; letter-spacing: 0.14em;
        line-height: 1.3; margin-left: 0.14em;
      }
      .splash-dots { display: flex; gap: 10px; margin-top: 34px; }
      .splash-dots span {
        width: 11px; height: 11px; border-radius: 50%;
        animation: splash-bounce 1.2s infinite ease-in-out;
      }
      .splash-dots span:nth-child(1) { background: #E0455F; }
      .splash-dots span:nth-child(2) { background: #ffffff; animation-delay: 0.15s; }
      .splash-dots span:nth-child(3) { background: #8fb3ff; animation-delay: 0.3s; }
      @keyframes splash-bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30% { transform: translateY(-7px); opacity: 1; }
      }
      .splash-note { color: #98a2b0; font-size: 0.8rem; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <h1 class="splash-title">Uncle Sam FC</h1>
        <div class="splash-motto">
          <span class="m-line">Oh when the</span>
          <span class="m-yanks">YANKS</span>
          <span class="m-line">go marching in</span>
        </div>
        <div class="splash-dots"><span></span><span></span><span></span></div>
        <div class="splash-note">Warming up&hellip;</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
