# Render blueprint — deploy Uncle Sam FC as a single web service.
# In the Render dashboard: New + > Blueprint > select this repo,
# then set API_FOOTBALL_KEY when prompted (it is never stored in git).
services:
  - type: web
    name: usa-fc
    runtime: node
    # Starter (paid, always-on). Never set back to free: free instances spin down
    # after 15 idle minutes, and a Blueprint sync enforces whatever this says —
    # a dashboard-only upgrade WILL be reverted by the next render.yaml push
    # (that's exactly what happened on 2026-09-10).
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/meta
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: ADMIN_KEY # bearer token for /api/admin/stats and the /admin page
        sync: false
