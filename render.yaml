# LEGACY — NOT IN USE (Sept 2026). The live deployment is the `uncle-sam-fc`
# PLAIN web service, created and configured entirely in the Render dashboard
# after the Blueprint-managed `usa-fc` service below was suspended. No Blueprint
# should be connected to this repo. If one ever is reconnected, update the
# service name below first — as written this file would recreate/manage the old
# `usa-fc` service, not the live one.
services:
  - type: web
    name: usa-fc
    runtime: node
    # Starter (paid, always-on). Never set back to free: free instances spin down
    # after 15 idle minutes, and a Blueprint sync enforces whatever this says —
    # a dashboard-only upgrade WILL be reverted by the next render.yaml push
    # (that's exactly what happened on 2026-09-10).
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/meta
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: ADMIN_KEY # bearer token for /api/admin/stats and the /admin page
        sync: false
